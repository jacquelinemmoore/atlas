<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas &mdash; My Museum &amp; Historical Site Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="app-header">
  <div class="header-inner">
    <h1 class="wordmark">Atlas</h1>
    <p class="tagline">a personal ledger of places seen &amp; unseen</p>
  </div>

  <form id="search-form" autocomplete="off">
    <input
      type="text"
      id="search-input"
      placeholder="Search a museum, church, castle, ruin&hellip;"
      aria-label="Search for a site to add"
    />
    <button type="submit" id="search-button">Search</button>
    <div id="search-results" class="search-results" hidden></div>
  </form>

  <div class="legend">
    <span class="legend-item">
      <span class="legend-icon" id="legend-icon-visited"></span>
      Visited
    </span>
    <span class="legend-item">
      <svg class="legend-icon" viewBox="0 0 40 40"><use href="#icon-compass"/></svg>
      Want to visit
    </span>
    <button id="export-btn" class="ghost-btn" title="Export your sites as a JSON file">Export</button>
    <button id="import-btn" class="ghost-btn" title="Import sites from a JSON file">Import</button>
    <input type="file" id="import-file" accept="application/json" hidden />
  </div>
</header>

<main id="map"></main>

<!-- ============ Add-Pin Confirmation Panel ============ -->
<div id="confirm-panel" class="panel" hidden>
  <div class="panel-card">
    <button class="panel-close" data-close-confirm aria-label="Close">&times;</button>
    <h2 id="confirm-name">Site name</h2>
    <p id="confirm-location" class="muted"></p>

    <div class="confirm-image-wrap">
      <img id="confirm-image" alt="" />
      <p class="drag-hint">Drag the image to reposition it</p>
      <label class="upload-label">
        Use your own photo instead
        <input type="file" id="confirm-image-upload" accept="image/*" hidden />
      </label>
    </div>

    <label class="field-label" for="confirm-known-for">Known for &mdash; each line becomes its own fact (press Enter to start a new one)</label>
    <textarea id="confirm-known-for" rows="5"></textarea>

    <fieldset class="status-choice">
      <legend>Status</legend>
      <label><input type="radio" name="status" value="wantToVisit" checked /> Want to visit</label>
      <label><input type="radio" name="status" value="visited" /> Already visited</label>
    </fieldset>

    <div class="panel-actions">
      <button id="confirm-cancel" class="ghost-btn">Cancel</button>
      <button id="confirm-save" class="primary-btn">Pin it</button>
    </div>
  </div>
</div>

<!-- ============ Site Detail Modal ============ -->
<div id="detail-modal" class="panel" hidden>
  <div class="panel-card">
    <button class="panel-close" data-close-detail aria-label="Close">&times;</button>
    <img id="detail-image" alt="" />
    <p class="drag-hint">Drag the image to reposition it</p>
    <h2 id="detail-name">Site name</h2>
    <p id="detail-location" class="muted"></p>

    <h3 class="section-heading">Known for</h3>
    <ul id="detail-known-for"></ul>

    <h3 class="section-heading">Visit history</h3>
    <ul id="detail-visits" class="visit-list"></ul>

    <div class="log-visit-row">
      <input type="date" id="log-visit-date" />
      <button id="log-visit-btn" class="primary-btn">Log Visit</button>
    </div>

    <button id="delete-pin-btn" class="danger-link">Remove this pin</button>
  </div>
</div>

<!-- SVG symbol defs: wax seal (visited) and compass star (want-to-visit) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="icon-seal" viewBox="0 0 40 40">
      <path fill="#6B1F2A" stroke="#4A1119" stroke-width="1"
        d="M20 2c2 1 3-1 5 1s0 4 2 5 4-1 5 1-2 3-1 5 4 1 4 3-3 2-3 4 3 3 1 5-4-1-5 1 1 4-1 5-4-1-5-1-2 3-4 3-2-3-4-3-3 3-5 1 1-4-1-5-4 1-5-1 3-3 3-5-3-3-1-5 4-1 4-3-2-3-1-5 4 0 5-1 3-2 5-1z"/>
      <path fill="#8A2E3D" d="M20 12l2.3 4.8 5.3.7-3.8 3.7.9 5.3L20 24l-4.7 2.5.9-5.3-3.8-3.7 5.3-.7z"/>
    </symbol>
    <symbol id="icon-star-mini" viewBox="0 0 40 40">
      <path fill="#f1e0b0" d="M20 6l3 9.5 10 .3-8 6.2 3 9.6-8-6-8 6 3-9.6-8-6.2 10-.3z"/>
    </symbol>
    <symbol id="icon-compass" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="17" fill="none" stroke="#C9A227" stroke-width="1.5"/>
      <path fill="#C9A227" d="M20 5l3.2 13.2 3.8 1.8-3.8 1.8L20 35l-3.2-13.2-3.8-1.8 3.8-1.8z"/>
      <path fill="#8A6A16" d="M5 20l13.2-3.2 1.8-3.8 1.8 3.8L35 20l-13.2 3.2-1.8 3.8-1.8-3.8z" opacity="0.55"/>
      <circle cx="20" cy="20" r="2" fill="#4A3A10"/>
    </symbol>
  </defs>
</svg>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
